[build-system]
requires = ["hatchling>=1.21"]
build-backend = "hatchling.build"

[project]
name = "rfp-analyzer"
version = "1.0.0"
description = "RFP Requirements Analyzer — extração, classificação e análise estratégica de requisitos de RFPs com IA (Groq via LiteLLM)."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "Proprietary — Positivo Tecnologia S.A." }
dependencies = [
  "pydantic>=2.6",
  "pydantic-settings>=2.2",
  "litellm>=1.40",          # LLM Router obrigatório (stack) — Groq como provider primário
  "pyyaml>=6.0",
  "typer>=0.12",
  "fastapi>=0.110",
  "uvicorn[standard]>=0.29",
  "python-multipart>=0.0.9",
  "openpyxl>=3.1",
]

[project.optional-dependencies]
pdf = ["pypdf>=4.0"]
docx = ["python-docx>=1.1"]
obs = ["openlit>=1.0"]      # instrumentação LLM obrigatória em QA/PRD
dev = ["pytest>=8.0", "httpx>=0.27", "ruff>=0.4", "mypy>=1.10", "types-PyYAML"]

[project.scripts]
rfp-analyzer = "rfp_analyzer.cli:app"

[tool.hatch.build.targets.wheel]
packages = ["src/rfp_analyzer"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src", "tests"]

[tool.ruff]
line-length = 125
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "S", "RUF"]
ignore = ["S101", "RUF001", "RUF002", "RUF003"]

[tool.mypy]
python_version = "3.11"
strict = true
ignore_missing_imports = true
